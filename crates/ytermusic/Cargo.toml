[package]
edition = "2021"
name = "ytermusic"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

ytpapi2.workspace = true

#  --- Threading & Sync ---
flume = "0.11.0"
once_cell = "1.19.0"
tokio = { version = "1.36.0", features = ["rt-multi-thread"] }

#  --- Encoding ---
bincode = { version = "1.3.3" }
directories = "5.0.1"
rand = "0.8.5"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
urlencoding = "2.1.3"
varuint = "0.7.1"

#  --- UI ---
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["serde"] }
unicode-bidi = "0.3"
unicode-width = "0.2"

#  --- Thumbnails (optional) ---
ratatui-image = { version = "11", optional = true, default-features = false, features = ["crossterm"] }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg"] }
reqwest = { version = "0.11.24", optional = true, default-features = false, features = ["rustls-tls"] }

#  --- Player ---
player.workspace = true

#  --- Media Control ---
souvlaki = "0.7.3"

#  --- Alloc ---
mimalloc = { version = "0.1.39", default-features = false }

#  --- Config ---
toml = "0.8.11"

#  --- Logging ---
log = "0.4.21"

#  --- Database ---
database.workspace = true
download-manager.workspace = true
common-structs.workspace = true

# -- Cookies auto retreival --
rookie = "0.5.2"

ctrlc = "3.5.0"

[features]
rusty-ytdl-backend = ["download-manager/rusty-ytdl-backend"]
# Show the album art of the playing song (kitty / sixel / iTerm2 terminals)
thumbnails = ["dep:ratatui-image", "dep:image", "dep:reqwest"]

[target."cfg(target_os = \"windows\")".dependencies]
raw-window-handle = "0.4.3"
winit = "0.26.1"
[target."cfg(target_os = \"macos\")".dependencies]
winit = "0.26.1"

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = 3
